<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 方塊人塔防傳奇 - 屍體碎裂保留版</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1b1b3a 0%, #090912 100%);
            color: #fff;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            text-align: center;
            touch-action: none;
            user-select: none;
        }
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        .active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .glass-panel {
            background: rgba(20, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        input, button {
            padding: 14px 28px;
            margin: 10px;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        button {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
        }
        button:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.15);
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.6);
        }
        button:active {
            transform: translateY(1px) scale(0.98);
        }
        input {
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
            width: 260px;
            text-align: center;
            outline: none;
        }
        input:focus {
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255,71,87,0.4);
        }
        
        #gameCanvas, #gachaCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 6px #000;
            pointer-events: none;
            background: rgba(10, 10, 20, 0.8);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
            z-index: 50;
        }
        #bottom-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(10, 10, 20, 0.85);
            padding: 12px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 50;
        }
        .deck-btn {
            position: relative;
            overflow: hidden;
            background: #2c3e50;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            pointer-events: none;
        }
        #victory-banner {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            color: #fff;
            padding: 25px 60px;
            font-size: 42px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 0 50px rgba(241, 196, 15, 0.9);
            border: 4px solid #fff;
            z-index: 100;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.3);
            pointer-events: none;
        }
        #victory-banner.show {
            transform: translate(-50%, -50%) scale(1);
        }
        #gacha-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(20,20,40,0.95) 0%, rgba(5,5,10,0.98) 100%);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body oncontextmenu="return false;">

    <!-- 1. 登入畫面 -->
    <div id="login-screen" class="screen active">
        <div class="glass-panel" style="width: 420px;">
            <h1 style="margin-top:0; color: #ff4757; text-shadow: 0 0 20px rgba(255,71,87,0.6); font-size: 32px;">🤖 方塊人塔防傳奇 🤖</h1>
            <p style="color: #aaa; margin-bottom: 25px;">完美高台發兵 | 擊殺屍體碎裂保留不消失</p>
            <input type="text" id="username" placeholder="輸入遊戲帳號"><br>
            <input type="password" id="password" placeholder="輸入遊戲密碼"><br>
            <button onclick="handleLogin()" style="width: 260px; margin-top: 15px;">進入冒險世界</button>
            <p id="login-msg" style="color: #ffd700; height: 25px; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- 2. 遊戲大廳 -->
    <div id="lobby-screen" class="screen">
        <div class="glass-panel" style="width: 480px;">
            <h1 style="color: #ffd700; margin-top:0; text-shadow: 0 0 15px rgba(255,215,0,0.5);">🏰 英雄大廳</h1>
            <div style="font-size: 20px; margin-bottom: 12px;">擁有金幣: <span id="lobby-gold" style="color: gold; font-weight: bold;">150</span> 🪙</div>
            <div style="font-size: 18px; margin-bottom: 20px;">冒險進度: <span id="lobby-stage" style="color: #00ffcc; font-weight: bold;">第 1 關</span></div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button onclick="startGachaAnimation()">✨ 尊爵傳奇轉蛋 (消耗 50 金幣)</button>
                <button onclick="openCodex()" style="background: linear-gradient(135deg, #3498db, #2980b9); box-shadow: 0 6px 20px rgba(52,152,219,0.4);">📖 3D 角色圖鑑與精緻預覽</button>
                <button onclick="openTeamEdit()" style="background: linear-gradient(135deg, #9b59b6, #8e44ad); box-shadow: 0 6px 20px rgba(155,89,182,0.4);">🛡️ 配置 10 人出戰部隊</button>
                <button onclick="openStageSelect()" style="background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 6px 20px rgba(46,204,113,0.4);">🚀 挑戰 3D 戰鬥關卡</button>
            </div>
            <div id="gacha-result" style="font-size: 16px; margin-top: 15px; color: #00ffcc; height: 35px; font-weight: bold;"></div>
        </div>
    </div>

    <!-- 扭蛋動畫全螢幕遮罩 -->
    <div id="gacha-overlay">
        <h2 id="gacha-title" style="color: #ffd700; margin-bottom: 10px; font-size: 28px; text-shadow: 0 0 15px rgba(255,215,0,0.6);">🎁 尊爵魔法轉蛋啟動中...</h2>
        <div id="gachaCanvasContainer" style="width: 420px; height: 420px; position: relative;">
            <canvas id="gachaCanvas" style="width: 420px; height: 420px; display: block;"></canvas>
        </div>
        <button id="gacha-close-btn" onclick="closeGachaOverlay()" style="display:none; background: linear-gradient(135deg, #2ed573, #26af5f); margin-top: 20px;">收下傳奇英雄</button>
    </div>

    <!-- 3. 角色圖鑑畫面 -->
    <div id="codex-screen" class="screen">
        <div class="glass-panel" style="width: 850px; height: 82vh; display: flex; flex-direction: column;">
            <h2 style="margin-top:0; color:#ffd700;">📖 3D 精緻角色圖鑑</h2>
            <div style="display: flex; flex: 1; gap: 20px; margin-top: 10px; overflow: hidden;">
                <div id="codex-canvas-container" style="flex: 1; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); position: relative;"></div>
                <div style="width: 280px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 480px; padding-right: 5px;" id="codex-list"></div>
            </div>
            <button onclick="backToLobby()" style="margin-top: 15px; align-self: center; width: 200px;">返回大廳</button>
        </div>
    </div>

    <!-- 4. 編輯隊伍畫面 -->
    <div id="team-screen" class="screen">
        <div class="glass-panel" style="width: 850px; max-height: 82vh; display: flex; flex-direction: column;">
            <h2 style="margin-top:0; color:#ffd700;">🛡️ 編輯 10 人出戰部隊 (已選 <span id="selected-count" style="color: #00ffcc;">3</span>/10)</h2>
            <div id="roster-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-height: 420px; overflow-y: auto; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);"></div>
            <button onclick="backToLobby()" style="align-self: center; margin-top: 20px; width: 200px;">返回大廳</button>
        </div>
    </div>

    <!-- 5. 關卡選擇畫面 -->
    <div id="stage-screen" class="screen">
        <div class="glass-panel" style="width: 750px; max-height: 82vh; display: flex; flex-direction: column;">
            <h2 style="margin-top:0; color:#ffd700;">🗺️ 選擇 3D 戰鬥關卡</h2>
            <div style="max-height: 420px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 15px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);" id="stage-list"></div>
            <button onclick="backToLobby()" style="align-self: center; margin-top: 20px; width: 200px;">返回大廳</button>
        </div>
    </div>

    <!-- 6. 3D 戰鬥畫面 -->
    <div id="game-screen" class="screen">
        <div id="ui-layer">
            金幣: <span id="game-gold" style="color: gold; font-weight: bold;">150</span> | 關卡: <span id="game-stage" style="color: #00ffcc;">1</span>/100 | [滑鼠拖曳 / 觸控] 自由旋轉視角
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="victory-banner">🏆 關卡大獲全勝！</div>
        <div id="bottom-hud">
            <button onclick="returnToLobbyFromGame()" style="background: linear-gradient(135deg, #7f8c8d, #95a5a6); padding: 10px 18px; font-size: 14px;">放棄返回</button>
            <div id="deck-cards" style="display: flex; gap: 8px;"></div>
            <button id="spawn-btn" onclick="trySpawnUnit()" style="background: linear-gradient(135deg, #2ed573, #26af5f); padding: 12px 24px; box-shadow: 0 4px 15px rgba(46,213,115,0.4);">⚔️ 派出英雄</button>
        </div>
    </div>

<script>
    let audioCtx = null;
    let bgmInterval = null;

    function initAudio() { 
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            initAudio(); if(!audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); let now = audioCtx.currentTime;
            if (type === 'spawn') { osc.frequency.setValueAtTime(350, now); osc.frequency.exponentialRampToValueAtTime(700, now + 0.12); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.12); osc.start(now); osc.stop(now + 0.12); }
            else if (type === 'hit') { osc.frequency.setValueAtTime(140, now); osc.frequency.linearRampToValueAtTime(60, now + 0.1); gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
            else if (type === 'win') { osc.frequency.setValueAtTime(523, now); osc.frequency.linearRampToValueAtTime(1046, now + 0.5); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(now); osc.stop(now + 0.5); }
            else if (type === 'lose') { osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(70, now + 0.5); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(now); osc.stop(now + 0.5); }
            else if (type === 'gacha') { osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1500, now + 1.2); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 1.2); osc.start(now); osc.stop(now + 1.2); }
            else { osc.frequency.setValueAtTime(440, now); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
        } catch(e) {}
    }

    function startBGM() {
        stopBGM();
        initAudio();
        if(!audioCtx) return;
        const melody = [329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63, 293.66, 329.63, 392.00, 329.63, 261.63];
        let noteIndex = 0;
        bgmInterval = setInterval(() => {
            if(!audioCtx || audioCtx.state !== 'running') return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(melody[noteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.28);
                noteIndex = (noteIndex + 1) % melody.length;
            } catch(e) {}
        }, 260);
    }

    function stopBGM() {
        if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    }

    let currentUser = null;
    let playerData = { gold: 150, maxStage: 1, unlockedChars: [0, 1, 2], team: [0, 1, 2] };

    const allCharacters = [];
    const baseNames = ["新手方塊人", "重裝騎士", "迅捷雙刀刺客", "狂暴巨獸", "狙擊槍手", "熔岩巨石兵", "影武者", "重砲騎兵", "聖光法師", "傳奇鋼鐵機甲", "烈焰戰神", "寒冰射手"];
    for(let i=0; i<100; i++) {
        let namePrefix = baseNames[i % baseNames.length];
        let name = i >= 12 ? `${namePrefix} #${i+1}` : namePrefix;
        let typeChoice = i % 6;
        allCharacters.push({
            id: i, name: name,
            hp: 90 + i * 20, atk: 16 + i * 4, speed: typeChoice === 3 ? 0.028 : (typeChoice === 4 ? 0.062 : 0.042),
            cost: 18 + i * 2, cooldownMax: 45, range: typeChoice === 2 ? 5.5 : 1.5,
            color: `hsl(${i * 35}, 85%, 58%)`,
            isMonster: typeChoice === 3, hasArmor: typeChoice === 1 || typeChoice === 5, hasGun: typeChoice === 2, hasStaff: typeChoice === 0 && i % 3 === 0
        });
    }

    let currentDeckIndex = 0;
    let unitCooldowns = {};

    function createRobloxAvatar(charData) {
        let group = new THREE.Group();
        let primaryColor = charData ? charData.color : "#3498db";
        
        let skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
        let headMat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
        let bodyMat = new THREE.MeshLambertMaterial({ color: primaryColor });
        let pantsMat = new THREE.MeshLambertMaterial({ color: 0x1e272e });
        let armorMat = new THREE.MeshLambertMaterial({ color: 0x485460 });
        let monsterMat = new THREE.MeshLambertMaterial({ color: 0x8b0000 });

        let scaleH = 0.8 + Math.random() * 0.4;
        let scaleW = 0.8 + Math.random() * 0.3;
        let parts = [];

        if (charData && charData.isMonster) {
            let mBody = new THREE.Mesh(new THREE.BoxGeometry(1.5 * scaleW, 1.8 * scaleH, 1.6 * scaleW), monsterMat);
            mBody.position.y = 0.9 * scaleH; group.add(mBody); parts.push(mBody);
            let mHead = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.2, 1.3), monsterMat);
            mHead.position.set(0.1, 2.1 * scaleH, 0); group.add(mHead); parts.push(mHead);
            group.userData = { body: mBody, head: mHead, parts, isMonster: true };
        } else {
            let body = new THREE.Mesh(new THREE.BoxGeometry(0.5 * scaleW, 1.0 * scaleH, 0.85 * scaleW), charData && charData.hasArmor ? armorMat : bodyMat);
            body.position.y = 0.5 * scaleH; group.add(body); parts.push(body);

            let head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), headMat);
            head.position.y = 1.35 * scaleH; group.add(head); parts.push(head);
            
            if (charData && charData.hasArmor) {
                let helmet = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.35, 0.76), armorMat);
                helmet.position.y = 1.55 * scaleH; group.add(helmet); parts.push(helmet);
            }

            let leftArm = new THREE.Group();
            leftArm.position.set(0, 0.9 * scaleH, -0.6);
            let lArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.9, 0.32), skinMat);
            lArmMesh.position.y = -0.45; leftArm.add(lArmMesh); group.add(leftArm); parts.push(lArmMesh);

            let rightArm = new THREE.Group();
            rightArm.position.set(0, 0.9 * scaleH, 0.6);
            let rArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.9, 0.32), skinMat);
            rArmMesh.position.y = -0.45; rightArm.add(rArmMesh); group.add(rightArm); parts.push(rArmMesh);

            let leftLeg = new THREE.Group();
            leftLeg.position.set(0, 0, -0.2);
            let lLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.9, 0.36), pantsMat);
            lLegMesh.position.y = -0.45; leftLeg.add(lLegMesh); group.add(leftLeg); parts.push(lLegMesh);

            let rightLeg = new THREE.Group();
            rightLeg.position.set(0, 0, 0.2);
            let rLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.9, 0.36), pantsMat);
            rLegMesh.position.y = -0.45; rightLeg.add(rLegMesh); group.add(rightLeg); parts.push(rLegMesh);

            group.userData = { leftArm, rightArm, leftLeg, rightLeg, body, head, parts, isMonster: false };
        }
        return group;
    }

    // ================= 華麗 3D 抽卡轉蛋動畫系統 =================
    let gachaAnimId = null;
    function startGachaAnimation() {
        if(playerData.gold < 50) { alert("金幣不足 50！"); return; }
        playerData.gold -= 50; document.getElementById('lobby-gold').innerText = playerData.gold;
        
        let unowned = allCharacters.filter(c => !playerData.unlockedChars.includes(c.id));
        let resDiv = document.getElementById('gacha-result');
        if(unowned.length === 0) { resDiv.innerText = "已擁有全部 100 種傳奇角色！"; playerData.gold += 50; return; }
        
        let newChar = unowned[Math.floor(Math.random() * unowned.length)];
        playerData.unlockedChars.push(newChar.id);
        saveCloud();

        document.getElementById('gacha-overlay').style.display = 'flex';
        document.getElementById('gacha-close-btn').style.display = 'none';
        document.getElementById('gacha-title').innerText = "🎁 尊爵魔法轉蛋旋轉中...";
        playSound('gacha');

        let container = document.getElementById('gachaCanvasContainer');
        container.querySelectorAll('canvas').forEach(c => c.remove());
        
        let gCanvas = document.createElement('canvas');
        gCanvas.id = 'gachaCanvas';
        gCanvas.style.width = '420px';
        gCanvas.style.height = '420px';
        container.appendChild(gCanvas);

        let gScene = new THREE.Scene();
        let gCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        gCamera.position.set(0, 0, 7);
        let gRenderer = new THREE.WebGLRenderer({ canvas: gCanvas, antialias: true, alpha: true });
        gRenderer.setSize(420, 420);

        gScene.add(new THREE.AmbientLight(0xffffff, 0.9));
        let dLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dLight.position.set(5, 8, 5); gScene.add(dLight);

        let capsuleGroup = new THREE.Group();
        let sphereGeo = new THREE.SphereGeometry(1.4, 32, 32);
        let sphereMat = new THREE.MeshLambertMaterial({ color: 0xff4757, transparent: true, opacity: 0.88 });
        let capsuleMesh = new THREE.Mesh(sphereGeo, sphereMat);
        capsuleGroup.add(capsuleMesh);

        let ringGeo = new THREE.TorusGeometry(1.7, 0.08, 16, 100);
        let ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        let ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        capsuleGroup.add(ringMesh);
        gScene.add(capsuleGroup);

        let frame = 0;
        function animateGacha() {
            frame++;
            capsuleGroup.rotation.y += 0.12;
            capsuleGroup.rotation.x += 0.06;
            ringMesh.rotation.z += 0.08;

            if(frame > 70 && frame < 90) {
                let scaleFactor = 1.0 + (frame - 70) * 0.03;
                capsuleGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }
            if(frame === 90) {
                gScene.remove(capsuleGroup);
                
                let pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.1, 0.4, 32), new THREE.MeshLambertMaterial({ color: 0x34495e }));
                pedestal.position.y = -1.2;
                gScene.add(pedestal);

                let charModel = createRobloxAvatar(newChar);
                charModel.position.set(0, -1.0, 0);
                charModel.scale.set(1.3, 1.3, 1.3);
                gScene.add(charModel);

                document.getElementById('gacha-title').innerText = `✨ 恭喜解鎖傳奇英雄：${newChar.name}！`;
                document.getElementById('gacha-close-btn').style.display = 'inline-block';
                playSound('win');
            }

            if(frame > 90) {
                gScene.children.forEach(child => {
                    if(child !== gScene.children[0] && child !== gScene.children[1]) {
                        child.rotation.y += 0.02;
                    }
                });
            }

            gRenderer.render(gScene, gCamera);
            if(frame <= 180) {
                gachaAnimId = requestAnimationFrame(animateGacha);
            }
        }
        animateGacha();
    }

    function closeGachaOverlay() {
        if(gachaAnimId) cancelAnimationFrame(gachaAnimId);
        document.getElementById('gacha-overlay').style.display = 'none';
        enterLobby();
    }

    function handleLogin() {
        playSound('click');
        let user = document.getElementById('username').value.trim();
        let pass = document.getElementById('password').value.trim();
        if(!user || !pass) { document.getElementById('login-msg').innerText = "請完整輸入帳號與密碼！"; return; }
        let db = JSON.parse(localStorage.getItem('roblox_tower_db_v10') || "{}");
        if(db[user]) {
            if(db[user].pass === pass) { currentUser = user; playerData = db[user].data; }
            else { document.getElementById('login-msg').innerText = "密碼錯誤！"; return; }
        } else {
            db[user] = { pass: pass, data: playerData };
            localStorage.setItem('roblox_tower_db_v10', JSON.stringify(db));
            currentUser = user;
        }
        enterLobby();
    }
    function saveCloud() {
        if(!currentUser) return;
        let db = JSON.parse(localStorage.getItem('roblox_tower_db_v10') || "{}");
        if(db[currentUser]) { db[currentUser].data = playerData; localStorage.setItem('roblox_tower_db_v10', JSON.stringify(db)); }
    }
    function enterLobby() {
        stopBGM();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('lobby-screen').classList.add('active');
        document.getElementById('lobby-gold').innerText = playerData.gold;
        document.getElementById('lobby-stage').innerText = `第 ${playerData.maxStage} 關`;
    }
    function backToLobby() { playSound('click'); stopGame(); enterLobby(); }
    function returnToLobbyFromGame() { playSound('click'); stopGame(); enterLobby(); }

    // ================= 角色圖鑑與模型預覽 =================
    let codexScene, codexRenderer, codexModel = null;
    function openCodex() {
        playSound('click');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('codex-screen').classList.add('active');
        
        let container = document.getElementById('codex-canvas-container');
        container.innerHTML = "";

        setTimeout(() => {
            let width = container.clientWidth || 400;
            let height = container.clientHeight || 400;

            codexScene = new THREE.Scene();
            let camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(5, 2.2, 0); camera.lookAt(0, 0.6, 0);

            codexRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            codexRenderer.setSize(width, height);
            container.appendChild(codexRenderer.domElement);

            codexScene.add(new THREE.AmbientLight(0xffffff, 0.9));
            let dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7); codexScene.add(dirLight);

            if(playerData.unlockedChars.length > 0) {
                showCodexCharacter(playerData.unlockedChars[0]);
            }

            let listDiv = document.getElementById('codex-list');
            listDiv.innerHTML = "";
            playerData.unlockedChars.forEach(id => {
                let c = allCharacters[id];
                let btn = document.createElement('button');
                btn.style.width = "100%";
                btn.style.padding = "10px";
                btn.style.margin = "4px 0";
                btn.style.background = "rgba(255,255,255,0.08)";
                btn.innerText = `${c.name}`;
                btn.onclick = () => showCodexCharacter(id);
                listDiv.appendChild(btn);
            });

            function animateCodex() {
                if(document.getElementById('codex-screen').classList.contains('active')) {
                    requestAnimationFrame(animateCodex);
                    if(codexModel) codexModel.rotation.y += 0.015;
                    if(codexRenderer && codexScene) codexRenderer.render(codexScene, camera);
                }
            }
            animateCodex();
        }, 50);
    }

    function showCodexCharacter(id) {
        if(codexModel) codexScene.remove(codexModel);
        codexModel = createRobloxAvatar(allCharacters[id]);
        codexScene.add(codexModel);
    }

    function openTeamEdit() {
        playSound('click');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('team-screen').classList.add('active');
        document.getElementById('selected-count').innerText = playerData.team.length;
        let ctn = document.getElementById('roster-container'); ctn.innerHTML = "";
        playerData.unlockedChars.forEach(id => {
            let c = allCharacters[id];
            let inTeam = playerData.team.includes(id);
            let btn = document.createElement('button');
            btn.style.background = inTeam ? "rgba(46,213,115,0.3)" : "rgba(100,100,100,0.3)";
            btn.style.border = inTeam ? "1px solid #2ed573" : "1px solid rgba(255,255,255,0.2)";
            btn.innerHTML = `<b>${c.name}</b><br><span style="font-size:12px; color:#aaa;">血量:${c.hp} 攻擊:${c.atk}</span>`;
            btn.onclick = () => {
                if(inTeam) { if(playerData.team.length <= 1) return; playerData.team = playerData.team.filter(i => i !== id); }
                else { if(playerData.team.length >= 10) return; playerData.team.push(id); }
                saveCloud(); openTeamEdit();
            };
            ctn.appendChild(btn);
        });
    }

    function openStageSelect() {
        playSound('click');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('stage-screen').classList.add('active');
        let list = document.getElementById('stage-list'); list.innerHTML = "";
        for(let i=1; i<=100; i++) {
            let btn = document.createElement('button');
            let unlocked = i <= playerData.maxStage;
            btn.innerText = unlocked ? `第 ${i} 關` : `🔒 第 ${i} 關`;
            btn.style.width = "90px";
            btn.style.height = "55px";
            btn.style.background = unlocked ? "linear-gradient(135deg, #3498db, #2980b9)" : "rgba(50,50,50,0.5)";
            if(unlocked) btn.onclick = () => startBattle(i);
            list.appendChild(btn);
        }
    }

    // ================= 3D 戰鬥系統 (高台發兵 + 死亡倒地碎裂永存) =================
    let gameScene, gameCamera, gameRenderer, gameLoopId = null;
    let battleState = {};
    let isInteracting = false, touchXPrev = 0, touchYPrev = 0;
    let cameraAngleX = 0.55, cameraAngleY = 0, cameraDist = 19;

    function startBattle(stageNum) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('game-stage').innerText = stageNum;
        document.getElementById('victory-banner').classList.remove('show');
        document.getElementById('spawn-btn').style.display = 'inline-block';

        startBGM();

        let canvas = document.getElementById('gameCanvas');
        gameScene = new THREE.Scene();
        gameScene.background = new THREE.Color(0x0f0c29);

        gameCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        gameRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        gameRenderer.setSize(window.innerWidth, window.innerHeight);

        gameScene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(12, 25, 12); gameScene.add(dirLight);

        let floor = new THREE.Mesh(new THREE.BoxGeometry(64, 1.2, 16), new THREE.MeshLambertMaterial({ color: 0x1e272e }));
        floor.position.set(0, -0.6, 0); gameScene.add(floor);

        let road = new THREE.Mesh(new THREE.BoxGeometry(60, 1.25, 4.0), new THREE.MeshLambertMaterial({ color: 0x3d3d5c }));
        road.position.set(0, -0.57, 0); gameScene.add(road);

        battleState = {
            stage: stageNum, gold: 150,
            playerTowerHp: 1000, maxPlayerTowerHp: 1000,
            enemyTowerHp: 450 + stageNum * 110, maxEnemyTowerHp: 450 + stageNum * 110,
            units: [], enemies: [], fireworks: [], status: 'playing', frame: 0, winTimer: 0
        };

        unitCooldowns = {};
        playerData.team.forEach((_, idx) => { unitCooldowns[idx] = 0; });

        battleState.playerTowerMesh = createFragmentableTower(0x3498db);
        battleState.playerTowerMesh.position.set(-24, 0, 0); gameScene.add(battleState.playerTowerMesh);

        battleState.enemyTowerMesh = createFragmentableTower(0xe74c3c);
        battleState.enemyTowerMesh.position.set(24, 0, 0); gameScene.add(battleState.enemyTowerMesh);

        currentDeckIndex = 0; updateDeckUI();

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        if(gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoop();
    }

    function createFragmentableTower(color) {
        let group = new THREE.Group();
        let mat = new THREE.MeshLambertMaterial({ color: color });
        let bricks = [];
        for(let y=0; y<4; y++) {
            for(let x=0; x<2; x++) {
                for(let z=0; z<2; z++) {
                    let mesh = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), mat);
                    mesh.position.set((x-0.5)*1.45, y*1.45 + 0.7, (z-0.5)*1.45);
                    group.add(mesh);
                    bricks.push({ mesh: mesh, basePos: mesh.position.clone(), vel: new THREE.Vector3() });
                }
            }
        }
        group.userData = { bricks: bricks };
        return group;
    }

    function updateDeckUI() {
        let deckDiv = document.getElementById('deck-cards');
        deckDiv.innerHTML = "";
        playerData.team.forEach((charId, idx) => {
            let c = allCharacters[charId];
            let btn = document.createElement('div');
            btn.className = 'deck-btn';
            btn.style.border = currentDeckIndex === idx ? "2px solid #ffd700" : "1px solid rgba(255,255,255,0.15)";
            btn.innerHTML = `<span style="font-weight:bold; color:#fff;">${c.name}</span><span style="color:gold;">$${c.cost}</span>`;
            
            let cdOverlay = document.createElement('div');
            cdOverlay.className = 'cooldown-overlay';
            cdOverlay.id = `cd-${idx}`;
            cdOverlay.style.height = "0%";
            btn.appendChild(cdOverlay);

            btn.onclick = () => { currentDeckIndex = idx; updateDeckUI(); };
            deckDiv.appendChild(btn);
        });
    }

    function trySpawnUnit() {
        if(battleState.status !== 'playing') return;
        let charId = playerData.team[currentDeckIndex];
        let c = allCharacters[charId];
        if(battleState.gold < c.cost) { playSound('hit'); return; }
        if(unitCooldowns[currentDeckIndex] > 0) return;

        battleState.gold -= c.cost;
        unitCooldowns[currentDeckIndex] = c.cooldownMax;
        playSound('spawn');

        let model = createRobloxAvatar(c);
        // 設定在高一點的位置生成 (y = 1.6)
        model.position.set(-21, 1.6, (Math.random() - 0.5) * 2.2);
        gameScene.add(model);

        battleState.units.push({
            mesh: model, data: c, hp: c.hp, maxHp: c.hp, atk: c.atk,
            speed: c.speed, range: c.range, state: 'walk', target: null
        });
    }

    function onPointerDown(e) {
        isInteracting = true;
        touchXPrev = e.clientX || (e.touches && e.touches[0].clientX);
        touchYPrev = e.clientY || (e.touches && e.touches[0].clientY);
    }
    function onPointerMove(e) {
        if(!isInteracting) return;
        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
        let clientY = e.clientY || (e.touches && e.touches[0].clientY);
        let dx = clientX - touchXPrev;
        let dy = clientY - touchYPrev;
        touchXPrev = clientX; touchYPrev = clientY;
        cameraAngleY -= dx * 0.008;
        cameraAngleX = Math.max(0.1, Math.min(1.3, cameraAngleX - dy * 0.008));
    }
    function onPointerUp() { isInteracting = false; }

    function stopGame() {
        if(gameLoopId) cancelAnimationFrame(gameLoopId);
        window.removeEventListener('mousedown', onPointerDown);
        window.removeEventListener('mousemove', onPointerMove);
        window.removeEventListener('mouseup', onPointerUp);
        window.removeEventListener('touchstart', onPointerDown);
        window.removeEventListener('touchmove', onPointerMove);
        window.removeEventListener('touchend', onPointerUp);
    }

    // 遊戲主循環
    function gameLoop() {
        if(battleState.status === 'playing' || battleState.status === 'victory' || battleState.status === 'defeat') {
            gameLoopId = requestAnimationFrame(gameLoop);
        }
        battleState.frame++;

        if(battleState.frame % 40 === 0 && battleState.gold < 999) battleState.gold += 3;

        Object.keys(unitCooldowns).forEach(idx => {
            if(unitCooldowns[idx] > 0) {
                unitCooldowns[idx]--;
                let cdEl = document.getElementById(`cd-${idx}`);
                if(cdEl) cdEl.style.height = `${(unitCooldowns[idx] / allCharacters[playerData.team[idx]].cooldownMax) * 100}%`;
            }
        });

        // 敵方定期出怪 (也在高處生成 y = 1.6)
        if(battleState.status === 'playing' && battleState.frame % 140 === 0) {
            let enemyChar = allCharacters[Math.min(battleState.stage + 2, allCharacters.length - 1)];
            let eModel = createRobloxAvatar(enemyChar);
            eModel.rotation.y = Math.PI;
            eModel.position.set(21, 1.6, (Math.random() - 0.5) * 2.2);
            gameScene.add(eModel);
            battleState.enemies.push({
                mesh: eModel, data: enemyChar, hp: enemyChar.hp * 1.2, maxHp: enemyChar.hp * 1.2,
                atk: enemyChar.atk * 1.1, speed: enemyChar.speed, range: 1.5, state: 'walk', target: null
            });
        }

        // ================= 我方單位更新與死亡碎裂判定 =================
        battleState.units.forEach(u => {
            if (u.state === 'dead') {
                // 屍體部位碎裂物理散落與重力下墜
                if (u.mesh.userData && u.mesh.userData.parts) {
                    u.mesh.userData.parts.forEach(p => {
                        if (p.userData.vel) {
                            p.position.add(p.userData.vel);
                            p.userData.vel.y -= 0.007; // 重力
                            // 落地阻擋
                            let worldY = u.mesh.position.y + p.position.y;
                            if (worldY < 0.2) {
                                p.position.y = 0.2 - u.mesh.position.y;
                                p.userData.vel.set(0, 0, 0);
                            }
                            p.rotation.x += 0.03;
                            p.rotation.z += 0.03;
                        }
                    });
                }
                return;
            }

            // 檢查血量死亡
            if (u.hp <= 0) {
                u.state = 'dead';
                // 賦予碎裂散落方向向量
                if (u.mesh.userData && u.mesh.userData.parts) {
                    u.mesh.userData.parts.forEach(p => {
                        p.userData.vel = new THREE.Vector3(
                            (Math.random() - 0.5) * 0.18,
                            Math.random() * 0.12 + 0.03,
                            (Math.random() - 0.5) * 0.18
                        );
                    });
                }
                return;
            }

            let walkCycle = Math.sin(battleState.frame * 0.25) * 0.4;
            if(!u.data.isMonster && u.mesh.userData.leftArm) {
                u.mesh.userData.leftArm.rotation.x = walkCycle;
                u.mesh.userData.rightArm.rotation.x = -walkCycle;
                u.mesh.userData.leftLeg.rotation.x = -walkCycle;
                u.mesh.userData.rightLeg.rotation.x = walkCycle;
            }

            if(u.state === 'walk') {
                u.mesh.position.x += u.speed;
                let hitEnemy = battleState.enemies.find(en => en.state !== 'dead' && en.mesh.position.distanceTo(u.mesh.position) <= u.range);
                if(hitEnemy) { u.state = 'fight'; u.target = hitEnemy; }
                else if(u.mesh.position.distanceTo(battleState.enemyTowerMesh.position) <= 3.5) {
                    u.state = 'fightTower';
                }
            } else if(u.state === 'fight') {
                if(!u.target || u.target.state === 'dead') { u.state = 'walk'; u.target = null; }
                else if(battleState.frame % 30 === 0) {
                    u.target.hp -= u.atk;
                    playSound('hit');
                    if(u.target.hp <= 0) {
                        battleState.gold += 15;
                        u.state = 'walk'; u.target = null;
                    }
                }
            } else if(u.state === 'fightTower') {
                if(battleState.frame % 30 === 0) {
                    battleState.enemyTowerHp -= u.atk;
                    playSound('hit');
                    if(battleState.enemyTowerHp <= 0) triggerVictory();
                }
            }
        });

        // ================= 敵方單位更新與死亡碎裂判定 =================
        battleState.enemies.forEach(en => {
            if (en.state === 'dead') {
                if (en.mesh.userData && en.mesh.userData.parts) {
                    en.mesh.userData.parts.forEach(p => {
                        if (p.userData.vel) {
                            p.position.add(p.userData.vel);
                            p.userData.vel.y -= 0.007;
                            let worldY = en.mesh.position.y + p.position.y;
                            if (worldY < 0.2) {
                                p.position.y = 0.2 - en.mesh.position.y;
                                p.userData.vel.set(0, 0, 0);
                            }
                            p.rotation.x += 0.03;
                            p.rotation.z += 0.03;
                        }
                    });
                }
                return;
            }

            if (en.hp <= 0) {
                en.state = 'dead';
                if (en.mesh.userData && en.mesh.userData.parts) {
                    en.mesh.userData.parts.forEach(p => {
                        p.userData.vel = new THREE.Vector3(
                            (Math.random() - 0.5) * 0.18,
                            Math.random() * 0.12 + 0.03,
                            (Math.random() - 0.5) * 0.18
                        );
                    });
                }
                return;
            }

            let walkCycle = Math.sin(battleState.frame * 0.25) * 0.4;
            if(!en.data.isMonster && en.mesh.userData.leftArm) {
                en.mesh.userData.leftArm.rotation.x = walkCycle;
                en.mesh.userData.rightArm.rotation.x = -walkCycle;
                en.mesh.userData.leftLeg.rotation.x = -walkCycle;
                en.mesh.userData.rightLeg.rotation.x = walkCycle;
            }

            if(en.state === 'walk') {
                en.mesh.position.x -= en.speed;
                let hitUnit = battleState.units.find(u => u.state !== 'dead' && u.mesh.position.distanceTo(en.mesh.position) <= en.range);
                if(hitUnit) { en.state = 'fight'; en.target = hitUnit; }
                else if(en.mesh.position.distanceTo(battleState.playerTowerMesh.position) <= 3.5) {
                    en.state = 'fightTower';
                }
            } else if(en.state === 'fight') {
                if(!en.target || en.target.state === 'dead') { en.state = 'walk'; en.target = null; }
                else if(battleState.frame % 30 === 0) {
                    en.target.hp -= en.atk;
                    playSound('hit');
                }
            } else if(en.state === 'fightTower') {
                if(battleState.frame % 30 === 0) {
                    battleState.playerTowerHp -= en.atk;
                    playSound('hit');
                    if(battleState.playerTowerHp <= 0) triggerDefeat();
                }
            }
        });

        // 注意：不從陣列中刪除死亡單位，讓屍體永久保留在場上碎裂散落！

        document.getElementById('game-gold').innerText = Math.floor(battleState.gold);

        let cx = Math.cos(cameraAngleY) * Math.cos(cameraAngleX) * cameraDist;
        let cz = Math.sin(cameraAngleY) * Math.cos(cameraAngleX) * cameraDist;
        let cy = Math.sin(cameraAngleX) * cameraDist;
        gameCamera.position.set(cx, cy + 2, cz);
        gameCamera.lookAt(0, 1, 0);

        gameRenderer.render(gameScene, gameCamera);
    }

    function triggerVictory() {
        if(battleState.status !== 'playing') return;
        battleState.status = 'victory';
        playSound('win');
        document.getElementById('victory-banner').classList.add('show');
        if(playerData.maxStage <= battleState.stage && battleState.stage < 100) {
            playerData.maxStage = battleState.stage + 1;
        }
        playerData.gold += 80;
        saveCloud();
        setTimeout(enterLobby, 3500);
    }

    function triggerDefeat() {
        if(battleState.status !== 'playing') return;
        battleState.status = 'defeat';
        playSound('lose');
        alert("防禦塔遭敵軍攻陷！挑戰失敗！");
        enterLobby();
    }
</script>
